[defaults]
# Default inventory file to use
inventory          = inventory.ini

# Path to find roles
roles_path         = roles

# Don't prompt to confirm unknown SSH host keys
# (set to True in production for security)
host_key_checking  = False

# Show coloured output
force_color        = True

# Number of servers to configure in parallel
forks              = 5

# Path to store retry files when a playbook fails partway through
retry_files_enabled = False

# SSH timeout in seconds
timeout            = 30

[ssh_connection]
# Reuse the same SSH connection for multiple tasks (faster)
pipelining         = True
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s