---
# ── DOCKER ROLE ───────────────────────────────────────────────────────────────
# Installs Docker Engine and Docker Compose on Ubuntu

- name: Remove old Docker versions if present
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  become: yes
  ignore_errors: yes    # don't fail if these packages don't exist

- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  become: yes

- name: Create Docker GPG keyring directory
  file:
    path:  /etc/apt/keyrings
    state: directory
    mode:  '0755'
  become: yes

- name: Download and add Docker's official GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
    | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg   # skip if file already exists
  become: yes

- name: Add Docker apt repository
  shell: |
    echo \
    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu \
    $(lsb_release -cs) stable" \
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  become: yes

- name: Install Docker Engine
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: yes

- name: Ensure Docker service is started and enabled on boot
  service:
    name:    docker
    state:   started
    enabled: yes
  become: yes

- name: Install docker-compose standalone (v2)
  shell: |
    curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
    -o /usr/local/bin/docker-compose && \
    chmod +x /usr/local/bin/docker-compose
  args:
    creates: /usr/local/bin/docker-compose
  become: yes

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false    # this task never changes state

- name: Print Docker version
  debug:
    msg: "✅ Docker installed: {{ docker_version.stdout }}"

- name: Verify Docker Compose installation
  command: docker-compose --version
  register: compose_version
  changed_when: false

- name: Print Docker Compose version
  debug:
    msg: "✅ Docker Compose installed: {{ compose_version.stdout }}"