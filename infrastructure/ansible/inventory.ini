# This file lists all the servers Ansible can manage
# Each section in [brackets] is a group of servers

[vps]
# ── FOR LOCAL TESTING (run on your own machine via WSL) ───────────────────────
localhost ansible_connection=local

# For production VPS, replace localhost with your actual VPS IP:
# YOUR_VPS_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[vps:vars]
ansible_python_interpreter=/usr/bin/python3