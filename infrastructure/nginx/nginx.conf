events {
    worker_connections 1024;
}

http {

    # upstream blocks define backend server groups
    # The hostname matches the service name in docker-compose.yml
    upstream user_service {
        server user-service:3001;
    }

    upstream loan_service {
        server loan-service:3002;
    }

    upstream credit_service {
        server credit-service:3003;
    }

    upstream repayment_service {
        server repayment-service:3004;
    }

    server {
        listen 80;
        server_name localhost;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle browser preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Route /api/users/* to the user service
        location /api/users/ {
            proxy_pass         http://user_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route /api/loans/* to the loan service
        location /api/loans/ {
            proxy_pass         http://loan_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route /api/credit/* to the credit service
        location /api/credit/ {
            proxy_pass         http://credit_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route /api/repayments/* to the repayment service
        location /api/repayments/ {
            proxy_pass         http://repayment_service;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check for the gateway itself
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}