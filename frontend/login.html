<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroLend - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Gradient matching full screen background */
    .auth-bg {
      min-height: 100vh;
      background: linear-gradient(to bottom right, var(--primary-900), var(--primary-700), var(--primary-500));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <div class="auth-bg">
    <div style="width: 100%; max-width: 28rem;">

      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 3.5rem; height: 3.5rem; background-color: var(--accent-500); border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
          <span style="font-size: 1.5rem; font-weight: 700; color: var(--primary-900);">ML</span>
        </div>
        <h1 style="font-size: 1.875rem; font-weight: 700; color: #ffffff; letter-spacing: -0.025em;">MicroLend</h1>
        <p style="color: var(--primary-100); margin-top: 0.25rem; font-size: 0.875rem;">
          Empowering small businesses through accessible finance
        </p>
      </div>

      <div style="background-color: #ffffff; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); padding: 2rem;">
        <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--slate-900); margin-bottom: 1.5rem;">Sign in to your account</h2>
        
        <div id="error-alert" style="display: none; background-color: #fef2f2; border: 1px solid #fee2e2; color: #b91c1c; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem;"></div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
          <div>
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--slate-700); margin-bottom: 0.25rem;">Email address</label>
            <input type="email" id="email" required class="input" placeholder="you@example.com">
          </div>
          <div>
            <label style="display: block; font-size: 0.875rem; font-weight: 500; color: var(--slate-700); margin-bottom: 0.25rem;">Password</label>
            <input type="password" id="password" required class="input" placeholder="••••••••">
          </div>
          <button type="submit" id="submit-btn" class="btn-primary" style="margin-top: 0.5rem; width: 100%;">Sign in</button>
        </form>

        <p style="text-align: center; font-size: 0.875rem; color: var(--slate-400); margin-top: 1.5rem;">
          No account? <a href="register.html" style="color: var(--primary-700); font-weight: 500; text-decoration: none;">Register here</a>
        </p>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect logged-in users away from the login page
    if (Auth.isAuthenticated()) {
      const user = Auth.getUser();
      window.location.href = user && user.role === 'officer' ? 'officer.html' : 'borrower.html';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const loginPayload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await MicroLendAPI.auth.login(loginPayload);
        const { user, token } = response.data;
        
        // Save session items
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(user));

        // Redirect safely based on role
        if (user.role === 'officer' || user.role === 'admin') {
          window.location.href = 'officer.html';
        } else {
          window.location.href = 'borrower.html';
        }
      } catch (err) {
        errorAlert.innerText = err.response?.data?.error || 'Login failed. Please verify credentials.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign in';
      }
    });
  </script>
</body>
</html>
