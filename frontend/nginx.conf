server {
  listen 80;

  # Serve React files
  root  /usr/share/nginx/html;
  index index.html;

  # React Router — serve index.html for every route
  # Without this, refreshing /dashboard would give a 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend gateway
  # In Docker, all services share the microlend_network
  location /api/ {
    proxy_pass http://nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}