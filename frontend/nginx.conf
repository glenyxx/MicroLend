server {
    listen 80;

    root  /usr/share/nginx/html;
    index login.html; # Set default home page to login

    location / {
        # 1. Look for exact file match (e.g. style.css)
        # 2. Look for directory match
        # 3. Strip trailing slash and look for file.html (e.g. /login -> /login.html)
        # 4. Fall back to login page if not found
        try_files $uri $uri/ $uri.html /login.html;
    }

    # Proxy API calls directly to your backend gateway container
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}