<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Queue - MicroLend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="global-navbar-container"></div>

  <main style="max-width: 80rem; margin: 2rem auto; padding: 0 1rem;">
    <h1 class="page-title" style="margin-bottom: 0.25rem;">Review Queue</h1>
    <p style="color: var(--slate-400); font-size: 0.875rem; margin-bottom: 2rem;" id="queue-count-label">
      New loan applications awaiting initial review — 0 pending
    </p>

    <div id="loading-spinner" style="text-align: center; padding: 4rem 0;">
      <div style="display: inline-block; width: 2rem; height: 2rem; border: 3px solid var(--slate-200); border-bottom-color: var(--primary-700); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <div id="empty-state" style="display: none;" class="card">
      <p style="text-align: center; color: var(--slate-400); padding: 2rem 0;">No applications pending review</p>
    </div>

    <div id="applications-container" style="display: flex; flex-direction: column; gap: 1rem;"></div>
  </main>

  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Auth.protectPage('officer') || Auth.protectPage('admin')) {
      Utils.renderNavbar();

      let localLoansCache = [];

      const loadQueue = () => {
        MicroLendAPI.loans.getLoans({ status: 'applied' })
          .then(res => {
            localLoansCache = res.data.loans || [];
            document.getElementById('loading-spinner').style.display = 'none';
            renderList();
          })
          .catch(() => {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('empty-state').style.display = 'block';
          });
      };

      // Inline risk matrix engine helper to view values quickly inside rows
      window.fetchRowAIScore = async (loanId, amount, duration) => {
        const rowButton = document.getElementById(`score-btn-${loanId}`);
        rowButton.disabled = true;
        rowButton.innerText = 'Scoring...';

        try {
          const sampleUnderwriteResponse = await MicroLendAPI.credit.scoreLoan({
            monthly_income: 200000, // Matching baseline configuration
            debt_monthly: 20000,
            loan_amount: parseFloat(amount),
            years_in_business: 2,
            duration_months: parseInt(duration),
            sector: 0
          });

          const data = sampleUnderwriteResponse.data;
          const pct = Math.round(data.credit_score * 100);
          
          let recColor = 'text-amber-600';
          if (data.recommendation === 'approve') recColor = 'text-green-600';
          if (data.recommendation === 'reject') recColor = 'text-red-600';

          const targetNode = document.getElementById(`score-container-${loanId}`);
          targetNode.innerHTML = `
            <div style="margin-left: 1rem; padding: 0.75rem; background-color: var(--slate-50); border-radius: 0.5rem; text-align: center; min-width: 6rem;">
              <p style="font-size: 0.75rem; color: var(--slate-400); margin-bottom: 0.25rem;">AI Score</p>
              <p class="font-mono" style="font-size: 1.5rem; font-weight: 700; color: var(--primary-700);">${pct}</p>
              <p class="${recColor}" style="font-size: 0.75rem; text-transform: capitalize; margin-top: 0.25rem;">${data.recommendation.replace('_', ' ')}</p>
            </div>
          `;
        } catch {
          alert('Scoring automation process timed out.');
          rowButton.disabled = false;
          rowButton.innerText = 'Get AI Score';
        }
      };

      window.triggerUnderReview = async (loanId) => {
        try {
          await MicroLendAPI.loans.updateStatus(loanId, { status: 'reviewing', officer_notes: 'Under review by platform execution node.' });
          alert('Loan moved into checking queue context.');
          localLoansCache = localLoansCache.filter(l => l.id !== loanId);
          renderList();
        } catch {
          alert('Could not update status.');
        }
      };

      const renderList = () => {
        document.getElementById('queue-count-label').innerText = `New loan applications awaiting initial review — ${localLoansCache.length} pending`;
        const wrap = document.getElementById('applications-container');
        
        if (localLoansCache.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          wrap.innerHTML = '';
          return;
        }

        document.getElementById('empty-state').style.display = 'none';
        let html = '';

        localLoansCache.forEach(loan => {
          html += `
            <div class="card" style="display: flex; flex-direction: column; gap: 1rem;">
              <div style="display: flex; align-items: start; justify-content: space-between;">
                <div style="flex: 1;">
                  <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                    <span class="font-mono" style="font-size: 0.875rem; color: var(--slate-400);">#${loan.id}</span>
                    ${Utils.renderStatusBadge(loan.status)}
                    <span style="font-size: 0.875rem; color: var(--slate-400);">${new Date(loan.applied_at || loan.createdAt).toLocaleDateString()}</span>
                  </div>
                  <h3 style="font-weight: 500; color: var(--slate-800);">${loan.borrower_name || 'Business Owner'}</h3>
                  <p style="font-size: 0.875rem; color: var(--slate-400);">${loan.borrower_email || 'no-email@microlend.org'}</p>
                  <p style="font-size: 0.875rem; color: var(--slate-700); margin-top: 0.25rem;">${loan.purpose}</p>
                  
                  <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.5rem; font-size: 0.875rem;">
                    <span class="font-mono" style="font-weight: 600; color: var(--slate-800);">${parseFloat(loan.amount).toLocaleString()} XAF</span>
                    <span style="color: var(--slate-400);">${loan.duration_months} months</span>
                  </div>
                </div>

                <div id="score-container-${loan.id}"></div>
              </div>

              <div style="display: flex; align-items: center; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--slate-100);">
                <button id="score-btn-${loan.id}" onclick="fetchRowAIScore(${loan.id}, ${loan.amount}, ${loan.duration_months})" class="btn-secondary" style="font-size: 0.875rem; padding: 0.375rem 0.75rem;">Get AI Score</button>
                <button onclick="triggerUnderReview(${loan.id})" class="btn-primary" style="font-size: 0.875rem; padding: 0.375rem 0.75rem;">Start Review</button>
              </div>
            </div>
          `;
        });

        wrap.innerHTML = html;
      };

      loadQueue();
    }
  </script>
</body>
</html>
